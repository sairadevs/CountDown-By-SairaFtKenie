<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock at 12:00 AM</title>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #0f172a; /* dark bg */
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      text-align: center;
      width: 350px;
    }

    h2 {
      color: #c084fc;
      margin-bottom: 1rem;
    }

    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 1rem 0;
      color: #f1f5f9;
    }

    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔒 Unlock at 12:03 AM</h2>
    <div id="status">Locked until 12:00 AM</div>
    <button id="openBtn" disabled>Open Website</button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const openBtn = document.getElementById("openBtn");

    // Unlock target (today at 12:00 AM, or tomorrow if already past)
    let target = new Date();
    target.setHours(0, 0, 0, 0);

    if (new Date() > target) {
      target.setDate(target.getDate() + 1); // move to next midnight
    }

    function checkTime() {
      const now = new Date();

      if (now >= target) {
        statusEl.textContent = "✅ Unlocked!";
        openBtn.disabled = false;
      } else {
        const diffMs = target - now;
        const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
        const diffMin = Math.floor((diffMs % (1000 * 60 * 60)) / 60000);
        const diffSec = Math.floor((diffMs % 60000) / 1000);

        statusEl.textContent = `Locked - unlocks in ${diffHrs}h ${diffMin}m ${diffSec}s`;
        openBtn.disabled = true;
      }
    }

    // Run check every second
    checkTime();
    setInterval(checkTime, 1000);

    openBtn.addEventListener("click", () => {
      window.open("https://sairadevs.github.io/Website-By-Your-Friend-Kenie/", "_blank");
    });
  </script>
</body>
</html>
