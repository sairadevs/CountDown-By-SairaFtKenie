<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock on September 27 - 12:00 AM</title>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #0f172a;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      text-align: center;
      width: 350px;
    }

    h2 {
      color: #c084fc;
      margin-bottom: 1rem;
    }

    #status {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 1rem 0;
      color: #f1f5f9;
    }

    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔒 Unlock on - 12:00 AM</h2>
    <div id="status">Locked</div>
    <button id="openBtn" disabled>Open Website</button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const openBtn = document.getElementById("openBtn");

    // Unlock target: September 27, 2025 at 12:00 AM
    let target = new Date("2025-09-27T00:00:00");

    function checkTime() {
      const now = new Date();

      if (now >= target) {
        statusEl.textContent = "✅ Unlocked!";
        openBtn.disabled = false;
      } else {
        statusEl.textContent = "🔒 Locked until September 27, 12:00 AM";
        openBtn.disabled = true;
      }
    }

    // Run check on load
    checkTime();
    // Check every minute
    setInterval(checkTime, 60000);

    openBtn.addEventListener("click", () => {
      window.open("https://sairadevs.github.io/Website-By-Your-Friend-Kenie/", "_blank");
    });
  </script>
</body>
</html>
